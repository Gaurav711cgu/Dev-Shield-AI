<!DOCTYPE html>
<html>
<head>
<title>Report History</title>
</head>
<body>
<h2>All Reports</h2>
<table border="1">
<tr>
<th>ID</th><th>Time</th><th>Decision</th><th>Severity</th><th>Intent</th><th>Risk</th>
</tr>
{% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[6] }}</td>
</tr>
{% endfor %}
</table>
</body>
</html>
